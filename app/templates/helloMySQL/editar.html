{%extends "helloMySQL/index.html" %}
{%block titulo %} Editar{% endblock %}
{%block contenido %} 

    <h2>Formulario de Información Básica</h2>
    <form id="editEmpleadoForm" method="POST">
        <input type="hidden" name="_method" value="PUT">
        <input type="hidden" name="id" value="{{data["id"]}}">
        <label for="nombre">Nombre Completo:</label><br>
        <input type="text" id="nombre" name="name" value="{{data["name"]}}" required><br><br>

        <label for="email">Correo Electrónico:</label><br>
        <input type="email" id="email" name="email" value="{{data["email"]}}" required><br><br>

        <label for="telefono">Teléfono:</label><br>
        <input type="tel" id="telefono" name="phone" value="{{data["phone"]}}" required><br><br>

        <label for="direccion">Dirección:</label><br>
        <input type="text" id="direccion" name="address"value="{{data["address"]}}" ><br><br>

        <label for="descripcion">Descripción Breve:</label><br>
        <textarea id="descripcion" name="sumary" rows="4" cols="50">{{data["sumary"]}}</textarea><br><br>

        <input type="submit" value="Enviar">
    </form>

{% endblock %}
