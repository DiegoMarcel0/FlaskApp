function scaleX(x){

function scaleY(y){

function drawAtom(symbol, x, y) {
    const circle = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
    );

    circle.setAttribute("cx", x);
    circle.setAttribute("cy", y);
    circle.setAttribute("r", 40);
    circle.setAttribute("fill", "white");
    circle.setAttribute("stroke", "black");

    svg.appendChild(circle);
    const atom = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
    );

    atom.setAttribute("x", x);
    atom.setAttribute("y", y+10);
    atom.setAttribute("class", "atom");
    atom.textContent = symbol;

    svg.appendChild(atom);
}

function drawBond(x1, y1, x2, y2, order = 1) {
    const spacing = 6;
    order = order/2
    if (order === 1) {
        createLine(x1, y1, x2, y2);
    }
    else if (order === 2) {
        createLine(x1, y1 - spacing, x2, y2 - spacing);
        createLine(x1, y1 + spacing, x2, y2 + spacing);
    }
    else if (order === 3) {
        createLine(x1, y1, x2, y2);
        createLine(x1, y1 - spacing, x2, y2 - spacing);
        createLine(x1, y1 + spacing, x2, y2 + spacing);
    }
}

function createLine(x1, y1, x2, y2) {
    const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
    );

    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("class", "bond");

    svg.appendChild(line);
}

function drawElectronPair(x, y) {
    drawElectron(x - 13, y);

}

function occupiedDirections(node, nodes, edges) {

    const dirs = [];

    const neighbors = edges
        .filter(e =>
            e.source === node.id ||
            e.target === node.id
        );

    for (const edge of neighbors) {

        const id =
            edge.source === node.id
                ? edge.target
                : edge.source;

        const other =
            nodes.find(n => n.id === id);

        const dx = other.x - node.x;
        const dy = other.y - node.y;

        let dir;

        if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? "E" : "W";
        } else {
            dir = dy > 0 ? "S" : "N";
        }

        dirs.push(dir);
    }

    return dirs;
}

const input = document.getElementById("molInput");
const status = document.getElementById("status");
const saveBtn = document.getElementById("saveBtn");
const validateBtn = document.getElementById("validateBtn");

function validateMolecule() {

    const value = input.value.trim();

    if (!value) {
        setStatus("idle", "⏳ Esperando entrada");
        return;
    }

    setStatus("checking", "⏳ Validando...");

    setTimeout(() => {

        if (isValidMolecule(value)) {
            setStatus("valid", "✅ Molécula válida");
        } else {
            setStatus("invalid", "❌ Molécula inválida");
        }

    }, 400);
}

/* BOTÓN CLICK */
validateBtn.addEventListener("click", validateMolecule);

/* ENTER EN INPUT */
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        validateMolecule();
    }
});

/* VALIDACIÓN SIMPLE (placeholder) */
function isValidMolecule(text) {
    const regex = /^[A-Z][a-z]?\d*([A-Z][a-z]?\d*)*$/;
    return regex.test(text);
}

/* ESTADO UI */
function setStatus(state, message) {

    status.textContent = message;

    if (state === "valid") {
        saveBtn.disabled = false;
    } else {
        saveBtn.disabled = true;
    }
}
function formatFormula(formula) {
    return formula.replace(
        /(\d+)/g,
        '<sub>$1</sub>'
    );
