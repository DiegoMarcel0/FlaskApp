services:
  db:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: flaskapp
    volumes:
      - MySQL_General:/var/lib/mysql/
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -ppass -e 'SELECT 1'"]
      interval: 10s  
      timeout: 5s    # Tiempo máximo de espera por respuesta
      retries: 5     # Número de intentos antes de fallar
      start_period: 30s  
  flaskapp:
    build: ./app
    container_name: flaskapp
    restart: unless-stopped
    environment:
      DB_HOST: db        
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: pass
      DB_NAME: flaskapp
    depends_on:
      db:
        condition: service_healthy
    command: python app.py
    ports:
      - "4999:4999"
    volumes:
      - "./app:/app"
volumes:
  MySQL_General:
